<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI探索大冒险 · 智慧城市</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(135deg,#0a1628 0%,#0d2240 50%,#0a3355 100%);
  min-height:100vh;
  overflow-y:auto;
  overflow-x:hidden;
}
.screen{display:none;min-height:100vh;width:100%;padding:20px 16px 40px;}
.screen.active{display:flex;flex-direction:column;align-items:center;}

/* ===== 初始界面 ===== */
#introScreen{justify-content:center;}
.city-skyline{position:fixed;bottom:0;left:0;width:100%;height:160px;z-index:0;pointer-events:none;opacity:0.15;}
.intro-content{position:relative;z-index:2;text-align:center;max-width:640px;width:100%;animation:fadeUp .7s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
.intro-emoji{font-size:72px;margin-bottom:12px;display:block;animation:floatY 3s infinite ease-in-out;}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.intro-title{font-size:28px;font-weight:800;color:#fff;letter-spacing:.05em;margin-bottom:20px;text-shadow:0 0 20px rgba(0,220,255,.5);}
.intro-title span{color:#00e5ff;}
.story-box{
  background:rgba(0,40,80,.75);border:1.5px solid rgba(0,200,255,.25);
  border-radius:18px;padding:20px 24px;margin-bottom:26px;
  text-align:left;backdrop-filter:blur(8px);
}
.story-name{font-size:12px;font-weight:700;color:#00e5ff;letter-spacing:.08em;margin-bottom:10px;}
.story-text{font-size:15px;line-height:1.9;color:rgba(255,255,255,.88);}
.story-text .hl{color:#7cffcb;font-weight:700;}
.start-btn{
  padding:15px 48px;font-size:18px;font-weight:800;
  border:none;border-radius:99px;cursor:pointer;font-family:inherit;
  background:linear-gradient(90deg,#00b4d8,#00e5ff);color:#002840;
  box-shadow:0 0 28px rgba(0,229,255,.4);transition:.2s;letter-spacing:.05em;
}
.start-btn:hover{transform:scale(1.06);}

/* ===== 游戏界面 ===== */
#gameScreen{align-items:center;}
.game-wrap{
  width:100%;max-width:700px;
  background:rgba(255,255,255,.96);
  border-radius:24px;padding:22px 22px 26px;
  box-shadow:0 10px 40px rgba(0,0,0,.35);
}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.score-badge{font-size:15px;font-weight:700;color:#e05c3a;background:#fff3e0;padding:5px 14px;border-radius:99px;border:1.5px solid #ffcc80;}
.level-badge{font-size:15px;font-weight:700;color:#444;}
.prog-track{height:11px;background:#eee;border-radius:99px;overflow:hidden;margin-bottom:16px;}
.prog-bar{height:100%;border-radius:99px;background:linear-gradient(90deg,#00b4d8,#7cffcb);transition:.45s;}
.guide-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;}
.guide-icon{font-size:36px;flex-shrink:0;animation:floatY 3s infinite ease-in-out;}
.guide-bubble{
  background:#e8f5ff;border:1.5px solid #b3d9f5;
  border-radius:0 14px 14px 14px;padding:8px 12px;
  font-size:13.5px;line-height:1.65;color:#1a4060;flex:1;
}
.scene-wrap{width:100%;height:185px;border-radius:16px;overflow:hidden;margin-bottom:12px;box-shadow:0 4px 14px rgba(0,0,0,.15);}
.scene-wrap img{width:100%;height:100%;object-fit:cover;}
.q-text{font-size:16px;font-weight:700;line-height:1.7;color:#222;margin-bottom:14px;}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.opt{
  background:#fafafa;border:1.5px solid #e0e0e0;border-radius:12px;
  padding:13px 11px;font-size:13.5px;font-weight:600;
  color:#333;cursor:pointer;text-align:left;font-family:inherit;
  transition:border-color .15s,background .15s;line-height:1.5;
}
.opt:hover:not(:disabled){border-color:#e05c3a;background:#fff3ef;}
.opt.ok{background:#e8f5e9!important;border-color:#4caf50!important;color:#1b5e20!important;}
.opt.no{background:#ffebee!important;border-color:#f44336!important;color:#b71c1c!important;}
.opt .L{font-weight:700;margin-right:4px;color:#bbb;}
.opt.ok .L{color:#388e3c;}
.opt.no .L{color:#d32f2f;}
.explain{font-size:13.5px;line-height:1.75;padding:.75rem .95rem;border-radius:10px;margin-top:12px;display:none;}
.explain.ok{background:#e8f5e9;color:#2e7d32;border:1.5px solid #a5d6a7;}
.explain.no{background:#fff3e0;color:#bf360c;border:1.5px solid #ffcc80;}
.msg{margin-top:10px;font-size:20px;font-weight:700;text-align:center;min-height:30px;}
.next-btn{
  width:100%;margin-top:12px;padding:.75rem;
  background:#e05c3a;color:#fff;border:none;border-radius:12px;
  font-size:15px;font-weight:700;cursor:pointer;display:none;font-family:inherit;
}
.next-btn:hover{background:#c04a2c;}

/* ===== 结算界面 ===== */
#resultScreen{justify-content:center;}
.result-wrap{
  width:100%;max-width:380px;background:rgba(255,255,255,.97);
  border-radius:26px;padding:40px 28px 36px;text-align:center;
  box-shadow:0 10px 40px rgba(0,0,0,.3);animation:fadeUp .6s ease both;
}
.result-emoji{font-size:64px;margin-bottom:10px;}
.result-score-row{display:flex;align-items:flex-end;justify-content:center;gap:4px;margin-bottom:6px;}
.result-score-big{font-size:80px;font-weight:800;color:#e05c3a;line-height:1;}
.result-denom{font-size:28px;color:#ccc;font-weight:600;padding-bottom:8px;}
.result-label{font-size:15px;color:#999;margin-bottom:32px;}
.retry-btn{
  padding:.85rem 3rem;background:#e05c3a;color:#fff;
  border:none;border-radius:12px;font-size:16px;font-weight:700;
  cursor:pointer;font-family:inherit;transition:.15s;
}
.retry-btn:hover{background:#c04a2c;}
.star{position:fixed;font-size:30px;animation:fly 1s forwards;pointer-events:none;z-index:9999;}
@keyframes fly{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-260px) scale(2)}}
</style>
</head>

  <div class="intro-content">
    <span class="intro-emoji">🤖</span>
    <div class="intro-title">🏙️ <span>智慧城市</span>大冒险</div>
    <div class="story-box">
      <div class="story-name">📡 管家机器人 说：</div>
      <div class="story-text">
        你好，未来的城市建设者！我是<span class="hl">管家机器人</span>。最近，城市各区的 AI 系统出现了混乱，每个地方都在呼救，他们搞不清楚自己用的是哪项 AI 技术！只有掌握<span class="hl">人工智能知识</span>的勇士，才能帮助城市重新运转。我需要你的帮助！<span class="hl">闯过关卡，识别每个场景背后的正确 AI 技术</span>，修复城市系统，让智慧城市重新亮起来！
      </div>
    </div>
    <button class="start-btn" id="startBtn">🚀 出发！</button>
  </div>
</div>

<!-- 游戏界面 -->
<div class="screen" id="gameScreen">
  <div class="game-wrap">
    <div class="top-bar">
      <div class="score-badge">⭐ <span id="score">0</span> 颗星</div>
      <div class="level-badge">第 <span id="level">1</span> 关 / 6 关</div>
    </div>
    <div class="prog-track"><div class="prog-bar" id="progBar" style="width:16.6%"></div></div>
    <div class="guide-row">
      <div class="guide-icon">🤖</div>
      <div class="guide-bubble" id="guideTxt">正在载入场景…</div>
    </div>
    <div class="scene-wrap">
      <img id="sceneImg" src="" alt="场景图">
    </div>
    <div class="q-text" id="qText"></div>
    <div class="opts" id="opts"></div>
    <div class="explain" id="explain"></div>
    <div class="msg" id="msg"></div>
    <button class="next-btn" id="nextBtn">下一关 →</button>
  </div>
</div>

<!-- 结算界面 -->
<div class="screen" id="resultScreen">
  <div class="result-wrap">
    <div class="result-emoji" id="rEmoji">🏆</div>
    <div class="result-score-row">
      <div class="result-score-big" id="rScore">0</div>
      <div class="result-denom">/6</div>
    </div>
    <div class="result-label">答对题数</div>
    <button class="retry-btn" id="retryBtn">🔁 重新作答</button>
  </div>
</div>

var cur=0,score=0,answered=false;
function $(id){return document.getElementById(id);}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  $(id).classList.add('active');
  window.scrollTo(0,0);
}

$('startBtn').addEventListener('click',function(){
  cur=0;score=0;answered=false;
  showScreen('gameScreen');
  loadQ();
});
$('nextBtn').addEventListener('click',function(){
  cur++;
  if(cur<Q.length){loadQ();}else{showResult();}
});
$('retryBtn').addEventListener('click',function(){
  cur=0;score=0;answered=false;
  showScreen('gameScreen');
  loadQ();
});

function loadQ(){
  var q=Q[cur];
  answered=false;
  $('level').textContent=cur+1;
  $('score').textContent=score;
  $('progBar').style.width=((cur+1)/Q.length*100)+'%';
  $('guideTxt').textContent=q.guide;
  $('sceneImg').src=q.img;
  $('qText').textContent=q.q;
  $('explain').style.display='none';
  $('explain').className='explain';
  $('msg').innerHTML='';
  $('nextBtn').style.display='none';
  $('nextBtn').textContent=cur<Q.length-1?'下一关 →':'查看结果 🎉';
  var opts=$('opts');
  opts.innerHTML='';
  ['A','B','C','D'].forEach(function(l,i){
    var btn=document.createElement('button');
    btn.className='opt';
    btn.innerHTML='<span class="L">'+l+'.</span>'+q.opts[i];
    btn.addEventListener('click',function(){pick(btn,i);});
    opts.appendChild(btn);
  });
}

function pick(btn,i){
  if(answered)return;
  answered=true;
  var q=Q[cur];
  var correct=(i===q.ans);
  if(correct)score++;
  document.querySelectorAll('.opt').forEach(function(b){b.disabled=true;});
  var ex=$('explain');
  if(correct){
    btn.classList.add('ok');
    $('msg').innerHTML='🎉 太棒了！城市系统已修复！';
    ex.className='explain ok';
    ex.textContent='✅ '+q.tip;
    for(var k=0;k<8;k++)(function(k){setTimeout(createStar,k*100);})(k);
  }else{
    btn.classList.add('no');
    document.querySelectorAll('.opt')[q.ans].classList.add('ok');
    $('msg').innerHTML='🤖 加油！看看解析再继续～';
    ex.className='explain no';
    ex.textContent='💡 正确答案是「'+q.opts[q.ans]+'」。'+q.tip;
  }
  ex.style.display='block';
  $('score').textContent=score;
  $('nextBtn').style.display='block';
}

function createStar(){
  var s=document.createElement('div');
  s.innerHTML='⭐';s.className='star';
  s.style.left=(Math.random()*(window.innerWidth-50))+'px';
  s.style.top='50%';
  document.body.appendChild(s);
  setTimeout(function(){s.remove();},1100);
}

function showResult(){
  var emoji=['📖','📖','📖','💪','🌟','🌟','🏆'][score];
  $('rEmoji').textContent=emoji;
  $('rScore').textContent=score;
  showScreen('resultScreen');
}
</script>
